<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Bot Landing Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta
      name="description"
      content="Answer a few quick questions to see if you qualify"
    />
    <link href="styles.css" rel="stylesheet" media="all" />

    <!-- Retreaver JS API -->
    <script type="text/javascript">
      (function () {
          var scriptElement = document.createElement('script');
          scriptElement.type = 'text/javascript';
          scriptElement.async = true;
          scriptElement.defer = true;
          scriptElement.src = document.location.protocol + '//dist.routingapi.com/jsapi/v1/retreaver.min.js';
          (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(scriptElement);
      })();
    </script>
  </head>
  <body>
    <main class="min-h-screen">
      <div class="max-w-4xl mx-auto bg-white text-center text-gray-600">
        <div class="p-4">
          <p class="font-serif text-md sm:text-lg font-bold">
            <span style="background: white;padding: 3px 6px;border-radius: 4px;" class="text-red-600">Limited</span>
            <span class="text-white" style="background: #dc2625;padding: 2px 5px;border-radius: 5px;">Time Offer</span>
            <span id="currentDate"></span>
          </p>
          <h2 class="font-bold text-xl sm:text-3xl mt-1">
            <span class="text-black"
              >Answer A Few Quick Questions To See If You Qualify</span
            >
          </h2>
        </div>
        <div class="w-full md:col-span-1 text-center block">
          <div class="text-sm flex items-center justify-center">
            <span class="relative flex h-4 w-4 inline-flex mr-2">
              <span
                class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 bg-green-500"
              ></span>
              <span
                class="relative inline-flex rounded-full h-4 w-4 bg-green-500"
              ></span>
            </span>
            Alex is Online.
          </div>
        </div>
      </div>
      <div class="max-w-md mx-auto bg-white">
        <div class="p-4">
          <div class="space-y-4">

            <div id="chat-container">
            </div>

            <div class="text-center">
              <code id="debug"></code>
            </div>
            <!-- Disconnect message -->
            <div id="disconnected" class="pt-2 hidden">
              <div class="relative flex py-5 items-center">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink mx-4 text-gray-300 text-xs"
                  >Chat Closed</span
                >
                <div class="flex-grow border-t border-gray-200"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <!-- Optional compliance / disclaimer text goes here -->
    <div id="tcpa" class="pt-2 ">
      <div
        class="mx-auto max-w-7xl overflow- px-6 lg:px-8 text-sm sm:text-md leading-5 sm:leading-6 text-gray-500"
      >
        <div
          class="tcpa-container text-xs text-center leading-5 text-gray-500"
        ></div>
      </div>
    </div>
    <footer
      class="footer mt-12 footer-center p-4 mt-12 mb-2 text-center max-w-6xl mx-auto text-xs"
    >
      <div class="grid grid-flow-col gap-3 md:w-1/3 mx-auto my-8">
        <a class="link link-hover" href="/"> Terms & Conditions </a>
        <p class="text-blue-500">|</p>
        <a class="link link-hover" href="/"> Privacy Policy </a>
        <p class="text-blue-500">|</p>
        <a class="link link-hover" href="/"> CCPA </a>
      </div>
      <div class="mt-8">
        <p>Copyright © - All rights reserved - Your Company Name</p>
      </div>
    </footer>
    <script type="text/javascript">
      document.getElementById('currentDate').textContent =
        new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    </script>
    <script src="./configuration.js"></script>
    <script src="./chatbot.js"></script>
  </body>
</html>
